<!-- Dealer Report Section -->
<div *ngIf="activeSection === 'report'" class="container my-4">

  <!-- Toggle Buttons -->
  <div class="d-flex justify-content-center mb-3">
    <div class="btn-group" role="group">
      <button class="btn btn-outline-success mx-1" 
              [class.active]="showGenerate" 
              (click)="showGenerate = true">
        Generate Report
      </button>
      <button class="btn btn-outline-success mx-1" 
              [class.active]="!showGenerate" 
              (click)="showGenerate = false">
        View Reports
      </button>
    </div>
  </div>

  <!-- Generate Report Card -->
<!-- Generate Dealer Report Card -->
<div *ngIf="showGenerate"
     class="card border-success shadow-sm bg-light-green m-5 p-4 d-flex justify-content-center align-items-center">
  
  <!-- Inner Card for Form -->
  <div class="card shadow-lg rounded-4  border-success" style="max-width: 1000px; max-height:700px;">
    
    <!-- Header -->
    <div class="card-header bg-success text-white rounded-3 text-center justify-content-between align-items-center">
      <h5 class="mb-0">
        📄 Generate Dealer Report
      </h5>
    </div>

    <!-- Form Body -->
    <div class="card-body m-5">
      <form class="row g-4">
        <!-- Dealer Dropdown -->
        <div class="col-12">
          <label class="form-label text-success fw-semibold fs-6">Select Dealer</label>
          <select class="form-select border-success shadow-sm mx-2" [(ngModel)]="dealerIdInput" name="dealerSelect">
            <option value="" disabled selected>Select Dealer</option>
            <option *ngFor="let dealer of dealers" [value]="dealer.id">
              {{ dealer.name }} (ID: {{ dealer.id }})
            </option>
          </select>
        </div>

        <!-- Optional Filter (if needed, uncomment) -->
        <!--
        <div class="col-12">
          <label class="form-label text-success fw-semibold fs-6">Filter (Optional)</label>
          <input type="text" class="form-control border-success shadow-sm" placeholder="Enter filter"
                 [(ngModel)]="filterInput" name="filterInput">
        </div>
        -->

        <!-- Generate Button -->
        <div class="col-12 d-flex justify-content-center mt-5">
          <button class="btn btn-success px-4 shadow-sm" (click)="generateReport()" [disabled]="loading">
            {{ loading ? 'Generating...' : 'Generate Report' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>


  <!-- Reports Table -->
  <!-- Show table only if not generating and reports are available -->
<div class="card shadow-sm mb-4 border-success" 
     *ngIf="!showGenerate && reports.length > 0; else noReports">
  <div class="card-body">
    <h4 class="card-title text-success mb-4">All Reports</h4>
    <div class="card-body bg-light-green border-success rounded-4 table-responsive">
      <table class="table custom-table  bg-white shadow-sm">
        <thead class="table-success text-center">
          <tr>
            <th>Title</th>
            <th>Generated By</th>
            <th>Generated For</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody class="text-center align-middle">
          <tr *ngFor="let report of reports">
            <td>{{ report.title }}</td>
            <td>{{ report.generatedBy }}</td>
            <td>{{ report.generatedFor }}</td>
            <td>{{ report.createdAt | date:'short' }}</td>
            <td>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-success mx-1" (click)="viewReport(report.id)">View</button>
                <button class="btn btn-sm btn-outline-primary mx-1" (click)="downloadReport(report.id)">Download</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Show this if no reports available or if user is on View mode -->
<ng-template #noReports>
  <div *ngIf="!showGenerate">
    <div class="alert alert-warning text-center">
      No reports available.
    </div>
  </div>
</ng-template>

  <!-- Selected Report -->
  <div *ngIf="selectedReport" class="card shadow-sm mb-4 border-success">
    <div class="card-body">
      <h4 class="card-title text-success">{{ selectedReport.title }}</h4>
      <pre class="bg-light p-3 rounded border border-success" style="white-space: pre-wrap;">
{{ selectedReport.content }}
      </pre>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

</div>
